# ===============================
# Application Identity
# ===============================
spring.application.name=api-gateway
server.port=8086

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# Payment Service route
spring.cloud.gateway.routes[0].id=payment-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter-replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter-burstCapacity=10

# Account Service route
spring.cloud.gateway.routes[1].id=account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/accounts/**
spring.cloud.gateway.routes[1].uri=http://localhost:8080
spring.cloud.gateway.routes[1].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[1].args.redis-rate-limiter-replenishRate=10
spring.cloud.gateway.routes[1].filters[1].args.redis-rate-limiter-burstCapacity=10
# Transaction Service route
spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/transactions/**
spring.cloud.gateway.routes[2].uri=http://localhost:8085
spring.cloud.gateway.routes[2].filters[2].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[2].args.redis-rate-limiter-replenishRate=10
spring.cloud.gateway.routes[2].filters[2].args.redis-rate-limiter-burstCapacity=10

# ===============================
# Actuator (Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

