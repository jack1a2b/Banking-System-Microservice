# ===============================
# Application Identity
# ===============================
spring.application.name=api-gateway
server.port=8086

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Payment Service route
spring.cloud.gateway.routes[0].id=payment-service
spring.cloud.gateway.routes[0].uri=lb://payment-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/payments/**

# Account Service route
spring.cloud.gateway.routes[1].id=account-service
spring.cloud.gateway.routes[1].uri=lb://account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/accounts/**

# Transaction Service route
spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].uri=lb://transaction-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/transactions/**

# ===============================
# Resilience4j Rate Limiter
# ===============================
resilience4j.ratelimiter.instances.gateway.limit-for-period=10
resilience4j.ratelimiter.instances.gateway.limit-refresh-period=1s
resilience4j.ratelimiter.instances.gateway.timeout-duration=500ms

# ===============================
# Actuator (Monitoring)
# ===============================
# ===============================
# Actuator (Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

